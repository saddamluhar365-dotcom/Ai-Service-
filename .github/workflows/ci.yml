name: ci

on:
  pull_request:
  push:
    branches: [main, "feat/**"]
  merge_group:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[test]'
      - name: Ruff format check
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Tests
        run: pytest -q --cov=freelance_agent --cov-fail-under=80
      - name: Build
        run: python -m pip wheel . -w dist
